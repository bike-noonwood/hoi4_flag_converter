[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-flag-converter"
version = "2.0.0"
description = "Convert images into Hearts of Iron IV flag assets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Juliusfrank11" }]

dependencies = [
    "Pillow>=9.0",
]

[project.scripts]
hoi4-flags = "hoi4_flag_converter.cli:main"

[project.urls]
Repository = "https://github.com/Juliusfrank11/hoi4_flag_converter"

[tool.setuptools.packages.find]
include = ["hoi4_flag_converter*"]
